[package]
name = "ssh-gpg-agent"
version = "0.1.6"
authors = ["Daniel Mueller <deso@posteo.net>"]
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://github.com/d-e-s-o/ssh-gpg-agent"
repository = "https://github.com/d-e-s-o/ssh-gpg-agent.git"
readme = "README.md"
categories = [
  "command-line-utilities",
  "authentication",
  "config",
  "cryptography",
  "network-programming",
]
keywords = [
  "ssh-agent",
  "ssh",
  "gpg",
  "authentication",
  "ed25519",
]
description = """
An SSH agent implementation that transparently supports PGP encrypted private SSH keys.
"""

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
incremental = false

[build-dependencies.grev]
version = "0.2"

[dependencies.anyhow]
version = "1.0.14"

[dependencies.dirs]
version = "7.0"

[dependencies.env_logger]
version = "0.11"
default-features = false

[dependencies.gpgme]
version = "0.11"

[dependencies.openssl]
version = "0.10.39"

[dependencies.log]
version = "0.4.8"

[dependencies.ssh-agent-lib]
version = "0.2.5"
features = ["agent"]

[dependencies.ssh-keys]
version = "0.1.3"

[dependencies.ring]
version = "0.17"
default-features = false
features = ["std"]

[lints.rust]
deprecated_safe = "warn"
future_incompatible = "warn"
keyword_idents = "warn"
let_underscore = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused = "warn"

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
diverging_sub_expression = "allow"
let_and_return = "allow"
let_unit_value = "allow"
module_inception = "allow"
type_complexity = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
indexing_slicing = "warn"
invalid_upcast_comparisons = "warn"
join_absolute_paths = "warn"
large_enum_variant = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
multiple_unsafe_ops_per_block = "warn"
panic_in_result_fn = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
string_slice = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unwrap_in_result = "warn"
use_self = "warn"
wildcard_imports = "warn"
